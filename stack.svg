      <text x="0" y="24" class="stack-font" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="middle">Next.js</text>
    </g>

    <g>
      <animateMotion dur="20s" repeatCount="indefinite" begin="-13.3s">
        <mpath href="#stack-path-orbit2" />
      </animateMotion>
      <circle cx="0" cy="0" r="15" fill="#0d111d" stroke="#3178c6" stroke-width="1.5" />
      <path d="M1.125 0C.502 0 0 .502 0 1.125v21.75C0 23.498.502 24 1.125 24h21.75c.623 0 1.125-.502 1.125-1.125V1.125C24 .502 23.498 0 22.875 0zm17.363 9.75c.612 0 1.154.037 1.627.111a6.38 6.38 0 0 1 1.306.34v2.458a3.95 3.95 0 0 0-.643-.361 5.093 5.093 0 0 0-.717-.26 5.453 5.453 0 0 0-1.426-.2c-.53 0-.96.083-1.289.248-.33.166-.495.427-.495.784 0 .232.06.43.18.595.12.165.3.3.541.407.24.107.545.207.915.3l.79.204c.82.204 1.488.487 2.003.848.514.362.772.909.772 1.642 0 .553-.14 1.033-.42 1.442a3.7 3.7 0 0 1-1.168 1.05c-.499.277-1.11.416-1.834.416-.763 0-1.492-.083-2.187-.25a9.387 9.387 0 0 1-1.653-.612v-2.616c.642.39 1.25.68 1.824.87.574.19 1.12.285 1.64.285.508 0 .918-.088 1.23-.264.312-.176.468-.45.468-.823 0-.312-.108-.567-.323-.765a3.86 3.86 0 0 0-1.047-.565l-.89-.253c-.76-.214-1.378-.507-1.853-.88-.475-.372-.713-.912-.713-1.62 0-.58.146-1.08.438-1.5.292-.42.715-.745 1.27-.975.556-.23 1.228-.345 2.016-.345zM3.445 9.945h8.84v2.336H9.72v8.528H6.965v-8.528H3.445z" fill="#3178c6" transform="translate(-7, -7) scale(0.6)" />
      <text x="0" y="24" class="stack-font" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <!-- ORBIT 1 (INNER, Tilted -16deg) -->
  <g transform="translate(470, 195) rotate(-16)">
    <ellipse cx="0" cy="0" rx="200" ry="58" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="2 4" />

