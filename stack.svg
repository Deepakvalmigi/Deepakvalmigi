      <path d="M12 9c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm0 4.5c-.828 0-1.5-.672-1.5-1.5s.672-1.5 1.5-1.5 1.5.672 1.5 1.5-.672 1.5-1.5 1.5zm10.5-2.5c0-1.5-2.5-3.5-6-4.5 1.5-2 2-4 1.5-5-.5-1-2.5-1-5 .5-1.5-2-3.5-3-5-3s-3.5 1-5 3c-2.5-1.5-4.5-1.5-5-.5-.5 1 0 3 1.5 5-3.5 1-6 3-6 4.5s2.5 3.5 6 4.5c-1.5 2-2 4-1.5 5 .5 1 2.5 1 5-.5 1.5 2 3.5 3 5 3s3.5-1 5-3c2.5 1.5 4.5 1.5 5 .5.5-1 0-3-1.5-5 3.5-1 6-3 6-4.5z" fill="#22d3ee" transform="translate(-8, -8) scale(0.7)" />
