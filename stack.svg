        <circle cx="24" cy="0" r="5.5" fill="#0d111d" stroke="#f472b6" stroke-width="1" />
        <text x="24" y="2.5" class="stack-mono" font-size="5.5" font-weight="800" fill="#f472b6" text-anchor="middle">Z</text>
      </g>
