        <circle cx="24" cy="0" r="5.5" fill="#0d111d" stroke="#a78bfa" stroke-width="1" />
        <text x="24" y="2.5" class="stack-mono" font-size="5.5" font-weight="800" fill="#a78bfa" text-anchor="middle">V</text>
