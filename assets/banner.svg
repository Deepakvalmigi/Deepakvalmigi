<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0F1524" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="320" fill="url(#bg-grad)" />

  <!-- Architecture Grid Overlay -->
  <rect width="850" height="320" fill="url(#grid)" />

  <!-- Ambient Glow in the center -->
  <circle cx="425" cy="160" r="280" fill="url(#glow-grad)" filter="url(#glow)" />

  <!-- Decorative Tech Elements / Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 830 40 L 830 20 L 810 20" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 20 280 L 20 300 L 40 300" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 830 280 L 830 300 L 810 300" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Horizontal Tech lines -->
  <line x1="50" y1="20" x2="800" y2="20" stroke="#1E293B" stroke-width="1" stroke-dasharray="5 5" />
  <line x1="50" y1="300" x2="800" y2="300" stroke="#1E293B" stroke-width="1" stroke-dasharray="5 5" />

  <!-- Code/Data flow nodes on the sides (visual representation of enterprise software) -->
  <g opacity="0.3">
    <!-- Left side node network -->
    <circle cx="80" cy="90" r="4" fill="#00F2FE" />
    <circle cx="120" cy="140" r="5" fill="#4FACFE" />
    <circle cx="60" cy="200" r="3" fill="#6366F1" />
    <line x1="80" y1="90" x2="120" y2="140" stroke="#334155" stroke-width="1" />
    <line x1="120" y1="140" x2="60" y2="200" stroke="#334155" stroke-width="1" />
    <line x1="120" y1="140" x2="180" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    
    <!-- Right side node network -->
    <circle cx="770" cy="90" r="3" fill="#6366F1" />
    <circle cx="730" cy="150" r="5" fill="#00F2FE" />
    <circle cx="790" cy="210" r="4" fill="#4FACFE" />
    <line x1="770" y1="90" x2="730" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="730" y1="150" x2="790" y2="210" stroke="#334155" stroke-width="1" />
    <line x1="730" y1="150" x2="670" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Central branding -->
  <g transform="translate(425, 145)" text-anchor="middle">
    <!-- Tiny top badge text -->
    <text y="-65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#00F2FE" letter-spacing="4" opacity="0.9">VERSALFLOW ECOSYSTEM</text>
    
    <!-- Main Name -->
    <text y="-10" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="url(#accent-grad)" letter-spacing="12">DEEPAK</text>
    
    <!-- Role Subheading -->
    <text y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" letter-spacing="6">FOUNDER &amp; PRODUCT ARCHITECT</text>
    
    <!-- Tech & Focus Line -->
    <text y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" letter-spacing="2">FULL-STACK ECOSYSTEMS • AI AUTOMATION • ENTERPRISE SOLUTIONS</text>
  </g>

  <!-- Custom badges -->
  <g transform="translate(0, 250)">
    <!-- CRM -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#1E293B" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
      <text x="40" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#00F2FE" text-anchor="middle">CRM</text>
    </g>
    <!-- Commerce -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#1E293B" stroke="#4FACFE" stroke-width="1" stroke-opacity="0.4" />
      <text x="47.5" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4FACFE" text-anchor="middle">COMMERCE</text>
    </g>
    <!-- Mobile App -->
    <g transform="translate(395, 0)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#1E293B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
      <text x="40" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6366F1" text-anchor="middle">MOBILE</text>
    </g>
    <!-- AI Suite -->
    <g transform="translate(495, 0)">
      <rect x="0" y="0" width="85" height="26" rx="13" fill="#1E293B" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
      <text x="42.5" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8B5CF6" text-anchor="middle">AI SUITE</text>
    </g>
    <!-- Enterprise -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#1E293B" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4" />
      <text x="47.5" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#EC4899" text-anchor="middle">ENTERPRISE</text>
    </g>
  </g>
</svg>
